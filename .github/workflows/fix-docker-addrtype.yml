name: Fix Docker addrtype

on:
  push:
    paths:
      - '.github/workflows/fix-docker-addrtype.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Enable required Docker addrtype match
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arch/arm64/configs/albus_defconfig')
          s=p.read_text()
          old='# CONFIG_NETFILTER_XT_MATCH_ADDRTYPE is not set'
          new='CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          if s.count(old) != 1:
              raise SystemExit(f'unexpected ADDRTYPE state/count: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          grep -qx 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_ANDROID_PARANOID_NETWORK=n' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/albus_defconfig
          grep -q '^#include <linux/android_aid.h>$' security/commoncap.c
          ! grep -q '^#ifdef CONFIG_ANDROID_PARANOID_NETWORK$' security/commoncap.c
          git diff --check
      - name: Commit fixed tree
        run: |
          git config user.name SaaSD3v
          git config user.email saasd3v@users.noreply.github.com
          git rm .github/workflows/fix-docker-addrtype.yml
          git add arch/arm64/configs/albus_defconfig
          git commit -m 'enable addrtype for Docker networking'
          git push origin HEAD:${GITHUB_REF_NAME}
